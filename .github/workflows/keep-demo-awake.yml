# Visit the public demo (https://climcanvas.streamlit.app/) every 4 hours so that
# Streamlit Community Cloud does not put it to sleep. Community Cloud sleeps an app
# after 12 hours without a visitor, and a plain HTTP request does not count, so the
# visit is made with a headless browser (demo/keepalive.py). The job fails when the
# app does not render, which also makes it a simple uptime check (GitHub mails the
# failure to the person who last changed this file). See demo/README.md.
name: Keep the public demo awake

on:
  schedule:
    # Every 4 hours (UTC). GitHub may delay scheduled runs by an hour or more at busy
    # times, hence the margin below the 12-hour limit. Not on the hour (less contention).
    - cron: "23 */4 * * *"
  # "Run workflow" button in the Actions tab, for testing after a change.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-demo-awake
  cancel-in-progress: false

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright with Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      # The browser cookies are carried from run to run so that these visits appear as
      # one viewer in the Community Cloud analytics. The key is unique per run; the
      # restore falls back to the most recent earlier run.
      - name: Restore the browser state of the previous run
        uses: actions/cache@v4
        with:
          path: keepalive-state.json
          key: keepalive-state-${{ github.run_id }}
          restore-keys: keepalive-state-
      - name: Visit the demo
        run: python demo/keepalive.py --state keepalive-state.json --screenshot keepalive-failure.png
      - name: Upload the screenshot of the failed visit
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-failure
          path: keepalive-failure.png
          if-no-files-found: ignore
          retention-days: 14
