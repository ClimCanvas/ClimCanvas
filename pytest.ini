# Restrict test collection to tests/.
# By default pytest collects every test_*.py under the repository, so a generated
# script with a name like "test_d3.py" left in temp/ gets imported too; its
# top-level plt.rcParams['font.family'] = ... then overrode the default font of
# the test process and every in-process (warm) image-identity test failed
# (2026-09-19).
[pytest]
testpaths = tests
